services:

  # ── Face Recognition API (Python/Flask) ───────────────────────────────────
  face-api:
    build:
      context: ./face-api
      dockerfile: Dockerfile
    container_name: evote_face_api
    restart: unless-stopped
    ports:
      - "5055:5055"
    volumes:
      - ./face-api/storage:/app/storage
    environment:
      FLASK_ENV: production
      FLASK_PORT: 5055
      API_SECRET_KEY: evote_face_secret_2024
      FACE_MODEL: Facenet512
      DETECTOR_BACKEND: mtcnn
      FACE_DISTANCE_THRESHOLD: "0.40"
      # Anti-spoof hanya saat verifikasi/voting, TIDAK saat registrasi (ringankan burst).
      ANTISPOOF_ON_REGISTER: "false"
      # Tuning gunicorn (server 2 core). Naikkan bila server diupgrade.
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "120"
      GUNICORN_BACKLOG: "256"
