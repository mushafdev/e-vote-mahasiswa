services:

  # ── Face Recognition API (Python/Flask) ───────────────────────────────────
  face-api:
    build:
      context: ./face-api
      dockerfile: Dockerfile
    container_name: evote_face_api
    restart: unless-stopped
    ports:
      # Hanya untuk Laravel di host yang sama — jangan dibuka ke internet.
      - "127.0.0.1:5055:5055"
    volumes:
      - ./face-api/storage:/app/storage
    environment:
      FLASK_ENV: production
      FLASK_PORT: 5055
      # Bobot model DeepFace disimpan di volume storage → tidak diunduh ulang
      # setiap container dibuat ulang (~95MB Facenet512).
      DEEPFACE_HOME: /app/storage
      API_SECRET_KEY: evote_face_secret_2024
      FACE_MODEL: Facenet512
      DETECTOR_BACKEND: mtcnn
      FACE_DISTANCE_THRESHOLD: "0.40"
      # Anti-spoof hanya saat verifikasi/voting, TIDAK saat registrasi (ringankan burst).
      ANTISPOOF_ON_REGISTER: "false"
      # Batasi sisi terpanjang gambar sebelum deteksi (memangkas biaya MTCNN).
      FACE_MAX_IMAGE_DIM: "640"
      # Tuning gunicorn (server 2 core). Naikkan bila server diupgrade.
      GUNICORN_WORKERS: "2"
      GUNICORN_TIMEOUT: "180"
      GUNICORN_BACKLOG: "256"
      # Batasi thread TensorFlow: tiap worker 1 thread → 2 worker mengisi 2 core
      # dengan bersih (tanpa saling berebut yang justru memperlambat semua).
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TF_NUM_INTRAOP_THREADS: "1"
      TF_NUM_INTEROP_THREADS: "1"
      TF_CPP_MIN_LOG_LEVEL: "2"
